      base_url: https://uu847021-9507-702f766a.bjb2.seetacloud.com:8443/flux2/v1
  # 薇光点亮公网 FLUX：拆衣服 VWorld_wardrobe-1.0、虚拟换衣 VWorld_outfit_1.0、体模 VWorld_bodymodel_1.0。

# 监听端口由 Pod 环境变量 WG_SERVER_GRPC_PORT / WG_SERVER_PUBLIC_GRPC_PORT 注入，不进 Nacos。

# 仅视频长任务 Submit/Get 使用；启动不会自动执行 migrations/。
database:
  dsn: "postgres://modelhub:modelhub@127.0.0.1:5432/modelhub?sslmode=disable"

# 每个 provider 实例声明其承载的真实模型 ID；同一模型可被多个实例声明，但必须由顶层 model_routes 显式选定当前走哪一个。
# 字面量清单见 models 包，调用方引用 github.com/wgdl666/wgModelHub/models，禁止在这里发明 alias。
providers:
  gemini_main:
    models: [gemini-2.5-flash, gemini-3.7-flash]
    gemini:
      api_key: "${GEMINI_API_KEY}"
      proxy_url: ""
  vertex_chat:
    models: [gemini-2.0-flash-001]
    vertexai:
      project: "${VERTEX_PROJECT}"
      location: us-central1
  ark_chat:
    models: [doubao-seed-1.6]
    ark:
      api_key: "${ARK_API_KEY}"
      base_url: https://ark.cn-beijing.volces.com/api/v3
  # Doubao Seed 2.0 mini：对外 doubao-seed-2.0-mini，上游走独立推理 endpoint，与 ark_chat 分实例。
  ark_doubao_mini:
    models: [doubao-seed-2.0-mini]
    ark:
      api_key: "${ARK_API_KEY}"
      base_url: https://ark.cn-beijing.volces.com/api/v3
      endpoint_id: ep-20260901122606-bcxpg
  # Doubao Seed 2.0 lite：对外 doubao-seed-2.0-lite，独立 endpoint，不得与 mini 共用部署。
  ark_doubao_lite:
    models: [doubao-seed-2.0-lite]
    ark:
      api_key: "${ARK_API_KEY}"
      base_url: https://ark.cn-beijing.volces.com/api/v3
      endpoint_id: ep-20260901133933-xqknf
  # Doubao Seed 2.1 Pro：衣橱候选搭配等文本链路；与 mini/lite/1.6 分实例，避免共用 endpoint 路由歧义。
  ark_doubao_21_pro:
    models: [doubao-seed-2.1-pro]
    ark:
      api_key: "${ARK_API_KEY}"
      base_url: https://ark.cn-beijing.volces.com/api/v3
      endpoint_id: ep-20260902131944-rj4cb
  # 方舟 Seedance 2.5 文生视频 / 首帧图生视频；与 ark_chat 分实例，避免文本 Responses 与视频任务混用能力集。
  ark_video:
    models: [doubao-seedance-2-5-260628]
    ark_video:
      api_key: "${ARK_API_KEY}"
      base_url: https://ark.cn-beijing.volces.com/api/v3
      poll_interval: 3
      max_poll_time: 600
  # Quick Speech：DashScope OpenAI-compatible，模型 ID 与线上一致。
  quick_speech:
    models: [qwen-flash]
    openai:
      api_key: "${DASHSCOPE_API_KEY}"
      base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
  # Async 视觉：独立 OpenAI-compatible 实例，避免与 speech/candidate 共用路由。
  async_vision:
    models: [qwen3-vl-plus]
    openai:
      api_key: "${ASYNC_VISION_API_KEY}"
      base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
  # Async 深度推荐候选：与 vision 分实例，便于独立密钥与配额。
  async_candidate:
    models: [qwen3.5-flash]
    openai:
      api_key: "${ASYNC_CANDIDATE_API_KEY}"
      base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
  # Hub 主对话：ThinkingDisabled 会由统一协议直接映射为 enable_thinking=false。
  hub_chat:
    models: [qwen3.7-flash]
    openai:
      api_key: "${DASHSCOPE_API_KEY}"
      base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
  # 同步一次性 TTS：与线上 wgHub Minimax WebSocket 对齐；输出固定 MP3/16kHz/mono。
  minimax_tts:
    models: [speech-2.8-turbo]
    minimax_tts:
      api_key: "${MINIMAX_API_KEY}"
      endpoint: wss://api.minimaxi.com/ws/v1/t2a_v2
      language_boost: Chinese
      voice_id: "Chinese (Mandarin)_Warm_Girl"
  # 当前生图主渠道：api.aig-ai.com 上的 Gemini generateContent（非 OpenAI Images）。
  # gemini-3-pro-image 仅绑此实例；两个 flash-image 与 aws_gemini 双声明，由 model_routes 手动切换。
  aig_gemini_image:
    models:
      - gemini-3-pro-image
      - gemini-2.5-flash-image
      - gemini-3.1-flash-image
    gemini:
      api_key: "${AIG_GEMINI_IMAGE_API_KEY}"
      base_url: https://api.aig-ai.com
  # AWS ECS workflow 备用渠道：仍用现有 gemini provider，留空 base_url 直连 Google 官方 Gemini API；不是 Bedrock。
  aws_gemini:
    models:
      - gemini-2.5-flash-image
      - gemini-3.1-flash-image
    gemini:
      api_key: "${AWS_GEMINI_API_KEY}"
      # base_url 留空：google.golang.org/genai BackendGeminiAPI 默认官方 endpoint。
  # gpt-image-2 必须走 OpenAI Images API（无参考图 generations、有参考图 edits），不能并入 Gemini generateContent 实例。
  ominilink_gpt_image:
    models: [gpt-image-2]
    openai:
      api_key: "${OMINILINK_IMAGE_API_KEY}"
      base_url: https://api.ominilink.ai/v1
  # LTX 供应商请求体里的 model 字段值就是 ltx，不是业务别名。
  ltx_video:
    models: [ltx]
    ltx:
      base_url: https://ltx.example
      token: "${LTX_TOKEN}"
      duration: 4
      fps: 24
      seed: 42
      poll_interval: 2
      max_poll_time: 120
  # DashScope Wan/HappyHorse/Kling 图生视频与 wan2.7-videoedit。
  dashscope_video:
    models:
      - wan2.2-i2v-flash
      - wan2.2-i2v-plus
      - wan2.2-i2v-turbo
      - wan2.6-i2v
      - wan2.6-i2v-flash
      - wan2.7-i2v
      - happyhorse-1.1-i2v
      - happyhorse-1.0-i2v
      - kling/kling-v3-video-generation
      - kling/kling-v3-omni-video-generation
      - wan2.7-videoedit
    dashscope_video:
      api_key: "${DASHSCOPE_API_KEY}"
      base_url: https://dashscope.aliyuncs.com/api/v1
      poll_interval: 3
      max_poll_time: 600
  # OminiLink vg-api 视频生成（含 UI 未展示的 Dreamina）。
  ominilink_video:
    models:
      - dreamina-seedance-2-0-mini
      - dreamina-seedance-2-0
      - dreamina-seedance-2-0-fast
      - kling-v2-master
      - kling-v2-1-master
      - kling-v2-5-turbo
      - kling-v2-6
      - kling-video-o1
      - kling-v3-omni
      - kling-v3
      - viduq3
      - viduq3-mix
      - viduq3-turbo
      - viduq3-pro-fast
      - viduq3-pro
      - veo-3.1-lite-generate-001
      - veo-3.1-fast-generate-001
      - veo-3.1-generate-001
    ominilink_video:
      api_key: "${OMINILINK_VIDEO_API_KEY}"
      base_url: https://vg-api.aig-ai.com/v1
      poll_interval: 3
      max_poll_time: 600
  # Gemini Interactions 图生视频与编辑；auth_header 可指向 OminiLink 网关。
  gemini_video:
    models: [gemini-omni-flash-preview]
    gemini_video:
      api_key: "${GEMINI_VIDEO_API_KEY}"
      base_url: https://generativelanguage.googleapis.com/v1beta
      auth_header: x-goog-api-key
      poll_interval: 5

# 多 provider 声明同一真实模型时必须显式选定；切换渠道只改这里并重启，无自动 failover。
# 切到 AWS workflow 备用渠道（底层直连 Google 官方 Gemini）时改为 aws_gemini。
model_routes:
  gemini-2.5-flash-image: aig_gemini_image
  gemini-3.1-flash-image: aig_gemini_image

  "阿里云_MaaS_${DASHSCOPE_WORKSPACE_ID}_qwen_asr":
    models: [qwen3-asr-flash-realtime-2026-02-10]
    qwen_asr:
      api_key: "${DASHSCOPE_API_KEY}"
      workspace_id: "${DASHSCOPE_WORKSPACE_ID}"
  腾讯云语音:
    models: [16k_zh]
    tencent_asr:
      app_id: "${TENCENT_ASR_APP_ID}"
      secret_id: "${TENCENT_ASR_SECRET_ID}"
      secret_key: "${TENCENT_ASR_SECRET_KEY}"
  AssemblyAI:
    models: [universal-3-5-pro]
    assemblyai_asr:
      api_key: "${ASSEMBLYAI_API_KEY}"
      url: wss://streaming.assemblyai.com/v3/ws
  Deepgram:
    models: [nova-3]
    deepgram_asr:
      api_key: "${DEEPGRAM_API_KEY}"
      url: wss://api.deepgram.com/v1/listen
  stt-rt.soniox.com:
    models: [stt-rt-v5]
    soniox_asr:
      api_key: "${SONIOX_API_KEY}"
      url: wss://stt-rt.soniox.com/transcribe-websocket
  # 当前生图主渠道：api.aig-ai.com 上的 Gemini generateContent（非 OpenAI Images）。
  # gemini-3-pro-image 仅绑此实例；两个 flash-image 与 Gemini_Developer_API_aws_gemini 双声明，由 model_routes 手动切换。
  AIG_gemini:

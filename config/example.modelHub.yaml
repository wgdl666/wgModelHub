# 多 provider 声明同一真实模型时必须显式选定；切换渠道只改这里并重启，无自动 failover。
# 切到 AWS workflow 备用渠道（底层直连 Google 官方 Gemini）时改为 Gemini_Developer_API_aws_gemini。
model_routes:
  gemini-2.5-flash-image: AIG_gemini
  gemini-3.1-flash-image: AIG_gemini
  # 两路都是同一个 Vertex 项目。非流式走 default，流式按首字竞速。
  gemini-3.5-flash-lite:
    default: Vertex_AI_chat
    race: [Vertex_AI_chat, Vertex_AI_chat_race]

# 账本媒体归档默认关闭；启用时填写 provider: oss 或 s3、bucket、region。
# OSS 使用阿里云官方 SDK，还需 endpoint、access_key_id、access_key_secret。
# AWS 使用官方 S3 SDK，省略静态凭据时走默认任务角色；endpoint 可保留区域端点。
# object_storage.provider/endpoint/凭据属于启动期资源，变更后需滚动重启。

    gemini:
      api_key: "${AIG_GEMINI_IMAGE_API_KEY}"
      base_url: https://api.aig-ai.com
  # AWS ECS workflow 备用渠道：仍用现有 gemini provider，留空 base_url 直连 Google 官方 Gemini API；不是 Bedrock。
  Gemini_Developer_API_aws_gemini:
    models:
      - gemini-2.5-flash-image

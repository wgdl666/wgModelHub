  # GPT Image 2 / 2.5：实例键是 AIG_openai（api.aig-ai.com OpenAI-compatible Images）；已实测 flare/sunburst generations。不要再复制旧键 async_gpt_image。
  # 无参考图 generations、有参考图 edits；不能并入上方 Gemini generateContent 生图实例，也不能与 FLUX.2 共用。

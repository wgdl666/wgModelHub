# 监听端口由 Pod 环境变量 WG_SERVER_GRPC_PORT / WG_SERVER_PUBLIC_GRPC_PORT / WG_SERVER_HTTP_PORT 注入，不进 Nacos。

# 颜色/look 共享一套语义，不按厂商维护。更新模板可热生效，不重建供应商连接。
# 颜色使用门槛评测的原始问法（“是”、无句号）；改文案后必须复核对应分数门槛。
rerank_templates:
  color:
    instruct: 'Given a color query, retrieve items whose main color is that color.'
    query_template: '检索主色是「{{query}}」的单品'
  look:
    instruct: 'Given a look query, retrieve items that satisfy every condition in the query.'
    query_template: '检索满足外观条件「{{query}}」的单品，单品必须满足查询中的所有条件。'

# 仅视频长任务 Submit/Get 使用；启动不会自动执行 migrations/。
database:
  dsn: "postgres://modelhub:modelhub@127.0.0.1:5432/modelhub?sslmode=disable"
# 先执行迁移创建 modelhub.prefix_cache，再按环境开启；不配置时默认关闭。
# 仅 Gemini/Vertex 文本 Generate；TTL 固定1小时，后台创建，不自动续期。
explicit_cache:
  enabled: false
  # 可选：仅为指定真实模型启用；省略或空列表表示不限制 Google 文本模型。
  models: [gemini-3.7-flash, gemini-3.8-flash]
# 每个 provider 实例声明其承载的真实模型 ID；同一模型可被多个实例声明，但必须由顶层 model_routes 显式选定当前走哪一个。
# 字面量清单见 models 包，调用方引用 github.com/wgdl666/wgModelHub/models，禁止在这里发明 alias。
providers:
  Gemini_Developer_API_gemini_main:
    # 3.8 与既有 Gemini 文本共用这一实例。3.5-flash-lite 不放这里：它的签名不能拿去和 Vertex 竞速。
    models: [gemini-3.5-flash, gemini-3.1-pro-preview, gemini-2.5-flash, gemini-3.7-flash, gemini-3.8-flash]
    gemini:
      api_key: "${GEMINI_API_KEY}"
      proxy_url: ""
  api.example.com:
    models: [gpt-5.4]
    openai:
      api_key: "${OMINILINK_API_KEY}"
      base_url: https://api.example.com/v1
  fashion-embedding.model.wgdl.tech:
    models: [fashion-embedding]
    fashion:
      base_url: https://fashion-embedding.model.wgdl.tech
      username: "${FASHION_USERNAME}"
      password: "${FASHION_PASSWORD}"
  fashion-reranker.model.wgdl.tech:
    models: [fashion-reranker]
    fashion:
      base_url: https://fashion-reranker.model.wgdl.tech
      username: "${FASHION_USERNAME}"
      password: "${FASHION_PASSWORD}"
  阿里云图像分割:
    models: [aliyun-segment-body, aliyun-segment-hd-body, aliyun-segment-commodity, aliyun-segment-common]
    image_seg:
      endpoint: imageseg.cn-shanghai.aliyuncs.com
      access_key_id: "${ALIYUN_ACCESS_KEY_ID}"
      access_key_secret: "${ALIYUN_ACCESS_KEY_SECRET}"
  # Vertex 文本与生图统一 ADC：不填 api_key；运行环境提供凭据文件，与 google_rerank 共用。
  # GOOGLE_APPLICATION_CREDENTIALS 指向只读凭据文件；文本与生图均固定 locations/global。
  Vertex_AI_chat:
    models: [gemini-2.0-flash-001, gemini-3.5-flash-lite]
    vertexai:
      project: "${VERTEX_PROJECT}"
  # 意图竞速的第二路。与 Vertex_AI_chat 同一个项目、同一条 locations/global 路径，签名才能互通。
  # 竞速名单不能重复同一个实例名，所以单独占一个实例。
  Vertex_AI_chat_race:
    models: [gemini-3.5-flash-lite]
    vertexai:
      project: "${VERTEX_PROJECT}"
  # Vertex 生图（含 Nano Banana 2.1 与 gemini-2.5-flash-image）一律打 locations/global。
  # Express 短路径不带 project，会落到调用方区域；图片模型不在 asia-southeast1。
  # project 必须显式配置；location 固定 global，不写在这里。ADC token 自动缓存/刷新。
  # 分辨率原样下发 1K/2K/4K。思考推荐 MINIMAL/MEDIUM/HIGH；LOW 原样下发，上游会拒绝。
  # 官方不支持 temperature；设置了会原样下发并返回上游错误。
  Vertex_AI_nano_banana:
    models: [gemini-nano-banana-2.1]
    vertexai:
      project: "${VERTEX_PROJECT}"
  火山方舟_ark_chat:
    models: [doubao-seed-1.6]
    ark:
      api_key: "${ARK_API_KEY}"
      base_url: https://ark.cn-beijing.volces.com/api/v3
  # Doubao Seed 2.0 mini：对外 doubao-seed-2.0-mini，上游走独立推理 endpoint，与 火山方舟_ark_chat 分实例。
  火山方舟_ark_doubao_mini:
    models: [doubao-seed-2.0-mini]
    ark:
      api_key: "${ARK_API_KEY}"
      base_url: https://ark.cn-beijing.volces.com/api/v3
      endpoint_id: ep-20260901122606-bcxpg
  # Doubao Seed 2.0 lite：对外 doubao-seed-2.0-lite，独立 endpoint，不得与 mini 共用部署。
  火山方舟_ark_doubao_lite:
    models: [doubao-seed-2.0-lite]
    ark:
      api_key: "${ARK_API_KEY}"
      base_url: https://ark.cn-beijing.volces.com/api/v3
      endpoint_id: ep-20260901133933-xqknf
  # Doubao Seed 2.1 Pro：衣橱候选搭配等文本链路；与 mini/lite/1.6 分实例，避免共用 endpoint 路由歧义。
  火山方舟_ark_doubao_21_pro:
    models: [doubao-seed-2.1-pro]
    ark:
      api_key: "${ARK_API_KEY}"
      base_url: https://ark.cn-beijing.volces.com/api/v3
      endpoint_id: ep-20260902131944-rj4cb
  # DeepSeek-V4-Flash 正式版：对外 deepseek-v4-flash，上游走独立推理 endpoint，与 Doubao/火山方舟_ark_chat 分实例。
  火山方舟_ark_deepseek_v4_flash:
    models: [deepseek-v4-flash]
    ark:
      api_key: "${ARK_API_KEY}"
      base_url: https://ark.cn-beijing.volces.com/api/v3
      endpoint_id: ep-20260904161804-km74x
  # DeepSeek-V4.1-Flash：新增独立 provider，不是切换 V4；对外 deepseek-v4.1-flash，绑定独立 endpoint。
  火山方舟_ark_deepseek_v41_flash:
    models: [deepseek-v4.1-flash]
    ark:
      api_key: "${ARK_API_KEY}"
      base_url: https://ark.cn-beijing.volces.com/api/v3
      endpoint_id: ep-20260916172350-hv45h
  # 方舟 Seedance 2.5 文生视频 / 首帧图生视频；与 火山方舟_ark_chat 分实例，避免文本 Responses 与视频任务混用能力集。
  火山方舟_ark_video:
    models: [doubao-seedance-2-5-260628]
    ark_video:
      api_key: "${ARK_API_KEY}"
      base_url: https://ark.cn-beijing.volces.com/api/v3
      poll_interval: 3
  # Quick Speech：DashScope OpenAI-compatible，模型 ID 与线上一致。
  阿里云百炼_openai_quick_speech:
    models: [qwen-flash, qwen3.7-plus, qwen3.8-max, kimi/kimi-k3]
    openai:
      api_key: "${DASHSCOPE_API_KEY}"
      base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
  # Async 视觉：独立 OpenAI-compatible 实例，避免与 speech/candidate 共用路由。
  阿里云百炼_openai_async_vision:
    models: [qwen3-vl-plus]
    openai:
      api_key: "${ASYNC_VISION_API_KEY}"
      base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
  # Async 深度推荐候选：与 vision 分实例，便于独立密钥与配额。
  阿里云百炼_openai_async_candidate:
    models: [qwen3.5-flash]
    openai:
      api_key: "${ASYNC_CANDIDATE_API_KEY}"
      base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
  # Hub 主对话：ThinkingDisabled 会由统一协议直接映射为 enable_thinking=false。
  # qwen3.8-flash 与 3.7 同属 DashScope 文本能力集（function calling / thinking / ephemeral cache）。
  阿里云百炼_openai_hub_chat:
    models: [qwen3.7-flash, qwen3.8-flash]
    openai:
      api_key: "${DASHSCOPE_API_KEY}"
      base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
  # Claude Haiku 4.5：固定官方快照 ID；用既有 OpenAI-compatible provider 类型指向 Anthropic 官方兼容端点，
  # 不新增只转发的 Anthropic provider 类型；不得下发 DashScope enable_thinking / cache_control。
  api.anthropic.com:
    models: [claude-haiku-4-5-20251001]
    openai:
      api_key: "${ANTHROPIC_API_KEY}"
      base_url: https://api.anthropic.com/v1
  # 智谱 GLM-5.3-flash：原生多模态文本，OpenAI-compatible Chat Completions。
  # 不发 thinking.type=disabled（智谱会拒绝）；关思考改为 reasoning_effort=low。
  智谱:
    models: [glm-5.3-flash]
    openai:
      api_key: "${ZHIPU_API_KEY}"
      base_url: https://open.bigmodel.cn/api/paas/v4
  # 同步一次性 TTS：与线上 wgHub Minimax WebSocket 对齐；输出固定 MP3/16kHz/mono。
  MiniMax:
    models: [speech-2.8-turbo]
    minimax_tts:
      api_key: "${MINIMAX_API_KEY}"
      endpoint: wss://api.minimaxi.com/ws/v1/t2a_v2
      language_boost: Chinese
      voice_id: "Chinese (Mandarin)_Warm_Girl"
  # ElevenLabs 同步 TTS：低延迟 flash 含中文；voice_id 由路演配置注入，示例勿填真实密钥。
  # stability/similarity_boost/style/speed 对应控制台滑条；省略则不覆盖音色账号默认。
  ElevenLabs:
    models: [eleven_flash_v2_5]
    elevenlabs_tts:
      api_key: "${ELEVENLABS_API_KEY}"
      base_url: https://api.elevenlabs.io
      voice_id: EXAVITQu4vr4xnSDxMaL
      # 路演示例：speed 0.90，stability/similarity 30%，style 50%。
      speed: 0.90
      stability: 0.30
      similarity_boost: 0.30
      style: 0.50
  # 实时 ASR 按厂家分实例；缺凭据时该实例和模型路由会被跳过，便于 CN/海外共用模板。
  火山语音:
    models: [volcengine-bigmodel-streaming]
    volcengine_asr:
      api_key: "${VOLCENGINE_ASR_API_KEY}"
      resource_id: volc.seedasr.sauc.duration
      url: wss://openspeech.bytedance.com/api/v3/sauc/bigmodel_async
  nls-gateway.cn-shanghai.aliyuncs.com:
    models: [aliyun-nls]
    aliyun_asr:
      app_key: "${ALIYUN_NLS_APP_KEY}"
      token: "${ALIYUN_NLS_TOKEN}"
      ak_id: "${ALIYUN_NLS_AK_ID}"
      ak_key: "${ALIYUN_NLS_AK_KEY}"

syntax = "proto3";

package wg_model_hub.v2;

import "google/rpc/status.proto";

option go_package = "github.com/wgdl666/wgModelHub/gen/wg_model_hub/v2;wg_model_hubv2";

// ModelHubService：Generate 承接文本/图片与迁移期同步视频；视频长任务走 Submit/Get。
// CreateCachedContent 仅服务 Gemini 等显式前缀缓存。
// capability 由 OutputSpec oneof 决定，真实供应商模型 ID 经 request.model 路由到唯一 provider 实例。
service ModelHubService {
  rpc Generate(GenerateRequest) returns (stream GenerateEvent);
  // 将会话级 system + 工具定义落到供应商 CachedContent，供后续 Generate.input.cached_content 引用。
  rpc CreateCachedContent(CreateCachedContentRequest) returns (CreateCachedContentResponse);
  // SubmitGeneration 第一阶段只接受 output.video；幂等键为 (x-wg-caller-service, request_id)。
  rpc SubmitGeneration(SubmitGenerationRequest) returns (GenerationTask);
  // GetGeneration 按调用查询任务；PENDING/RUNNING/FAILED 只回一个 status 事件，SUCCEEDED 先 status 再流式 output。
  rpc GetGeneration(GetGenerationRequest) returns (stream GenerationTaskEvent);
}

// GenerateRequest 顶层恰好三字段：业务调用方不得再塞供应商私有配置，
// 也不得把任务指令抽成独立 prompt 字段。
message GenerateRequest {
  // model 是真实供应商模型 ID（含版本），例如 gemini-2.5-flash。
  string model = 1;
  // system/用户任务/历史/媒体/tool_calls/tool output 一律按序放入 Input.items。
  Input input = 2;
  OutputSpec output = 3;
}

enum Role {
  ROLE_UNSPECIFIED = 0;
  ROLE_SYSTEM = 1;
  ROLE_USER = 2;
  ROLE_ASSISTANT = 3;
  // 工具结果只走 InputItem.tool_output，不再用 ROLE_TOOL 消息表达。
}

// Media 同时支持内联字节和供应商可访问 URI。
// 内联 data 必须带 mime_type；URI 的 mime_type 为可选提示，具体 provider 自行决定是否必需。
message Media {
  string mime_type = 1;
  oneof source {
    bytes data = 2;
    string uri = 3;
  }
}

message ContentPart {
  oneof content {
    string text = 1;
    Media image = 2;
    Media video = 3;
    Media audio = 4;
    Media file = 5;
  }
}

// Message 只承载对话角色内容与助手 tool_calls；工具回执见 InputItem.tool_output。
message Message {
  Role role = 1;
  repeated ContentPart parts = 2;
  repeated ToolCall tool_calls = 3;
}

message FunctionDefinition {
  string name = 1;
  string description = 2;
  bytes parameters_json_schema = 3;
}

message Tool {
  FunctionDefinition function = 1;
}

message ToolCall {
  string id = 1;
  string name = 2;
  bytes arguments_json = 3;
  bytes thought_signature = 4;
}

// ToolOutput 是工具回执的唯一协议形态；图片紧跟该回执，不另拆成相邻 Message。
message ToolOutput {
  string tool_call_id = 1;
  string tool_name = 2;
  string output = 3;
  repeated Media images = 4;
  bool is_error = 5;
}

message InputItem {
  oneof item {
    Message message = 1;
    ToolOutput tool_output = 2;
  }
}

// Input 承载有序上下文与工具配置；顺序对多模态与 tool loop 有语义。
message Input {
  repeated InputItem items = 1;
  repeated Tool tools = 2;
  ToolChoice tool_choice = 3;
  string previous_response_id = 4;
  // 文本 Generate 省略本字段时，ModelHub 默认写入 enabled=true；显式 enabled=false 可关闭。
  // 是否实际命中仍以 usage.cached_tokens > 0 为准，请求开启不等于命中。
  CachingConfig caching = 5;
  // Gemini 显式 CachedContent 资源名；与 Ark previous_response_id / caching.enabled 互不替代。
  // 引用时 system/tools 已在 cache 内，调用方不应再按屏裁剪 tools，也不应重复下发 system。
  string cached_content = 6;
}

// CreateCachedContentRequest 只缓存会话级稳定前缀：system_instruction + tools。
message CreateCachedContentRequest {
  string model = 1;
  string system_instruction = 2;
  repeated Tool tools = 3;
  // TTL 秒数；0 表示由供应商/实现默认（常见 1h）。
  int64 ttl_seconds = 4;
  string display_name = 5;
}

message CreateCachedContentResponse {
  // 供应商返回的资源名，原样填回后续 GenerateRequest.input.cached_content。
  string cached_content = 1;
  int64 expire_at_unix = 2;
}

enum ThinkingMode {
  THINKING_MODE_UNSPECIFIED = 0;
  THINKING_MODE_DISABLED = 1;
  THINKING_MODE_ENABLED = 2;
}

enum ResponseFormatType {
  RESPONSE_FORMAT_TYPE_UNSPECIFIED = 0;
  RESPONSE_FORMAT_TYPE_TEXT = 1;
  RESPONSE_FORMAT_TYPE_JSON_OBJECT = 2;
  RESPONSE_FORMAT_TYPE_JSON_SCHEMA = 3;
}

message ResponseFormat {
  ResponseFormatType type = 1;
  string name = 2;
  bytes json_schema = 3;
}

enum ToolChoiceMode {
  TOOL_CHOICE_MODE_UNSPECIFIED = 0;
  TOOL_CHOICE_MODE_AUTO = 1;
  TOOL_CHOICE_MODE_NONE = 2;
  TOOL_CHOICE_MODE_REQUIRED = 3;
  TOOL_CHOICE_MODE_FUNCTION = 4;
}

message ToolChoice {
  ToolChoiceMode mode = 1;
  string function_name = 2;
}

// CachingConfig 控制供应商侧 KV/前缀缓存开关（如 Ark caching.enabled）。
// 仅文本 Generate 缺省时由 ModelHub 默认 enabled；显式 false 保留关闭语义。
// 命中证据只看响应 usage.cached_tokens > 0，勿与 enabled 混读。
message CachingConfig {
  bool enabled = 1;
  int64 expire_at_unix = 2;
}

message TextOutput {
  optional int32 max_output_tokens = 1;
  // optional 保留显式 0，调用方设置后必须原样下发供应商。
  optional double temperature = 2;
  optional double top_p = 3;
  ResponseFormat response_format = 4;
  ThinkingMode thinking = 5;
}

enum ImageOutputModality {
  IMAGE_OUTPUT_MODALITY_UNSPECIFIED = 0;
  IMAGE_OUTPUT_MODALITY_IMAGE = 1;
  IMAGE_OUTPUT_MODALITY_TEXT = 2;
}

enum ThinkingLevel {
  THINKING_LEVEL_UNSPECIFIED = 0;
  THINKING_LEVEL_MINIMAL = 1;
  THINKING_LEVEL_LOW = 2;
  THINKING_LEVEL_MEDIUM = 3;
  THINKING_LEVEL_HIGH = 4;
}

message ImageOutput {
  repeated ImageOutputModality output_modalities = 1;
  optional string aspect_ratio = 2;
  optional string image_size = 3;
  optional double temperature = 4;
  ThinkingLevel thinking_level = 5;
}

message VideoOutput {
  string resolution = 1;
  // duration_seconds 与 aspect_ratio 供 DashScope/OminiLink/Gemini 视频生成保留原业务参数语义。
  optional int32 duration_seconds = 2;
  optional string aspect_ratio = 3;
}

// OutputSpec.stream 控制文本是否增量；kind oneof 决定 text/image/video 能力路由。
message OutputSpec {
  bool stream = 1;
  oneof kind {
    TextOutput text = 2;
    ImageOutput image = 3;
    VideoOutput video = 4;
  }
}

message Usage {
  int64 input_tokens = 1;
  int64 output_tokens = 2;
  int64 total_tokens = 3;
  int64 cached_tokens = 4;
  int64 reasoning_tokens = 5;
}

message SafetyFeedback {
  bool blocked = 1;
  string reason = 2;
  string message = 3;
}

// OutputItem 只表达模型产出：正文、媒体与 tool_call；工具回执不属于输出事件。
message OutputItem {
  oneof item {
    string text = 1;
    Media image = 2;
    Media video = 3;
    ToolCall tool_call = 4;
  }
}

// GenerateEvent 统一文本增量、图片终态与视频分块；错误仍走 gRPC status，不在事件内造第二套协议。
message GenerateEvent {
  uint32 sequence = 1;
  repeated OutputItem items = 2;
  bool final = 3;
  string response_id = 4;
  string finish_reason = 5;
  Usage usage = 6;
  SafetyFeedback safety = 7;
  // generation_elapsed_ms 保留 Gemini Interactions 等供应商上报的生成耗时；缺失时为 0。
  int64 generation_elapsed_ms = 8;
}

// SubmitGenerationRequest 只增加幂等 request_id；业务载荷仍是原 GenerateRequest。
message SubmitGenerationRequest {
  string request_id = 1;
  GenerateRequest request = 2;
}

message GetGenerationRequest {
  string task_id = 1;
}

// 公开任务状态；provider/supplier 细节不出现在对外协议。
enum GenerationTaskState {
  GENERATION_TASK_STATE_UNSPECIFIED = 0;
  GENERATION_TASK_STATE_PENDING = 1;
  GENERATION_TASK_STATE_RUNNING = 2;
  GENERATION_TASK_STATE_SUCCEEDED = 3;
  GENERATION_TASK_STATE_FAILED = 4;
}

// GenerationTask 只回 task_id + state；供应商 task id 仅存内部表。
message GenerationTask {
  string task_id = 1;
  GenerationTaskState state = 2;
}

message GenerationTaskStatus {
  GenerationTaskState state = 1;
  // PENDING/RUNNING 时提示调用方下次 Get 的间隔；终态可为 0。
  int32 poll_after_ms = 2;
  // 仅 FAILED 时填充；成功与运行中不携带。
  google.rpc.Status error = 3;
}

// GenerationTaskEvent：非终态与失败只走 status；成功先 status=SUCCEEDED，再复用 GenerateEvent 分块。
message GenerationTaskEvent {
  oneof event {
    GenerationTaskStatus status = 1;
    GenerateEvent output = 2;
  }
}

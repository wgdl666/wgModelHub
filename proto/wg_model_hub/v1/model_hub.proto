syntax = "proto3";

package wg_model_hub.v1;

option go_package = "github.com/wgdl666/wgModelHub/gen/wg_model_hub/v1;wg_model_hubv1";

// ModelHubService 是唯一部署接口；文本、图片和视频保留各自强类型请求，
// 避免用一个万能 payload 把不同供应商语义重新泄露给调用方。
service ModelHubService {
  rpc GenerateText(GenerateTextRequest) returns (GenerateTextResponse);
  rpc GenerateTextStream(GenerateTextRequest) returns (stream TextStreamEvent);
  rpc GenerateImage(GenerateImageRequest) returns (GenerateImageResponse);
  rpc GenerateVideo(GenerateVideoRequest) returns (stream VideoChunk);
}

enum Role {
  ROLE_UNSPECIFIED = 0;
  ROLE_SYSTEM = 1;
  ROLE_USER = 2;
  ROLE_ASSISTANT = 3;
  ROLE_TOOL = 4;
}

// Media 同时支持内联字节和供应商可访问 URI；mime_type 是协议事实，
// ModelHub 不通过额外 HEAD 请求猜测媒体类型。
message Media {
  string mime_type = 1;
  oneof source {
    bytes data = 2;
    string uri = 3;
  }
}

// ContentPart 的 oneof 既保留多模态顺序，也显式区分图片、视频、音频和文件。
message ContentPart {
  oneof content {
    string text = 1;
    Media image = 2;
    Media video = 3;
    Media audio = 4;
    Media file = 5;
  }
}

message Message {
  Role role = 1;
  repeated ContentPart parts = 2;
  repeated ToolCall tool_calls = 3;
  string tool_call_id = 4;
  string tool_name = 5;
}

message FunctionDefinition {
  string name = 1;
  string description = 2;
  bytes parameters_json_schema = 3;
}

message Tool {
  FunctionDefinition function = 1;
}

message ToolCall {
  string id = 1;
  string name = 2;
  bytes arguments_json = 3;
  bytes thought_signature = 4;
}

message ToolOutput {
  string tool_call_id = 1;
  string tool_name = 2;
  string output = 3;
  repeated Media images = 4;
  bool is_error = 5;
}

enum ThinkingMode {
  THINKING_MODE_UNSPECIFIED = 0;
  THINKING_MODE_DISABLED = 1;
  THINKING_MODE_ENABLED = 2;
}

enum ResponseFormatType {
  RESPONSE_FORMAT_TYPE_UNSPECIFIED = 0;
  RESPONSE_FORMAT_TYPE_TEXT = 1;
  RESPONSE_FORMAT_TYPE_JSON_OBJECT = 2;
  RESPONSE_FORMAT_TYPE_JSON_SCHEMA = 3;
}

message ResponseFormat {
  ResponseFormatType type = 1;
  string name = 2;
  bytes json_schema = 3;
}

enum ToolChoiceMode {
  TOOL_CHOICE_MODE_UNSPECIFIED = 0;
  TOOL_CHOICE_MODE_AUTO = 1;
  TOOL_CHOICE_MODE_NONE = 2;
  TOOL_CHOICE_MODE_REQUIRED = 3;
  TOOL_CHOICE_MODE_FUNCTION = 4;
}

message ToolChoice {
  ToolChoiceMode mode = 1;
  string function_name = 2;
}

message CachingConfig {
  bool enabled = 1;
  int64 expire_at_unix = 2;
}

message GenerateTextRequest {
  string model_profile = 1;
  repeated Message messages = 2;
  string instructions = 3;
  optional int32 max_output_tokens = 4;
  optional double temperature = 5;
  optional double top_p = 6;
  ResponseFormat response_format = 7;
  ThinkingMode thinking = 8;
  repeated Tool tools = 9;
  repeated ToolOutput tool_outputs = 10;
  ToolChoice tool_choice = 11;
  string previous_response_id = 12;
  CachingConfig caching = 13;
}

message Usage {
  int64 input_tokens = 1;
  int64 output_tokens = 2;
  int64 total_tokens = 3;
  int64 cached_tokens = 4;
  int64 reasoning_tokens = 5;
}

message GenerateTextResponse {
  string content = 1;
  repeated ToolCall tool_calls = 2;
  string response_id = 3;
  string finish_reason = 4;
  Usage usage = 5;
}

message TextStreamEvent {
  oneof event {
    string text_chunk = 1;
    ToolCall tool_call = 2;
    ToolOutput tool_output = 3;
    GenerateTextResponse completed = 4;
  }
}

enum ImageOutputModality {
  IMAGE_OUTPUT_MODALITY_UNSPECIFIED = 0;
  IMAGE_OUTPUT_MODALITY_IMAGE = 1;
  IMAGE_OUTPUT_MODALITY_TEXT = 2;
}

enum ThinkingLevel {
  THINKING_LEVEL_UNSPECIFIED = 0;
  THINKING_LEVEL_MINIMAL = 1;
  THINKING_LEVEL_LOW = 2;
  THINKING_LEVEL_MEDIUM = 3;
  THINKING_LEVEL_HIGH = 4;
}

message GenerateImageRequest {
  string model_profile = 1;
  // parts 必须按调用方给出的顺序发送，参考图与文字不能重排。
  repeated ContentPart parts = 2;
  repeated ImageOutputModality output_modalities = 3;
  optional string aspect_ratio = 4;
  optional string image_size = 5;
  optional double temperature = 6;
  ThinkingLevel thinking_level = 7;
}

message SafetyFeedback {
  bool blocked = 1;
  string reason = 2;
  string message = 3;
}

message GenerateImageResponse {
  // parts 保留供应商返回的图片与诊断文字顺序。
  repeated ContentPart parts = 1;
  string finish_reason = 2;
  SafetyFeedback safety = 3;
  Usage usage = 4;
}

message GenerateVideoRequest {
  string model_profile = 1;
  Media first_frame = 2;
  string prompt = 3;
  string resolution = 4;
}

message VideoChunk {
  uint32 sequence = 1;
  bytes data = 2;
  string mime_type = 3;
  bool final = 4;
}

name: Deploy AWS Ohio Exhibition

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: aws-exhibition-deploy-modelhub
  cancel-in-progress: false

# 不设置 jobs.*.environment：IAM 只信任 immutable sub
# repo:wgdl666@245333630/wgModelHub@1333925233:ref:refs/heads/dev。

jobs:
  deploy:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Validate deployment orchestration
        run: python3 -m unittest discover -s scripts/ci -p 'test_*.py'
      - name: Authenticate to AWS with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::054043816891:role/tomirro-modelhub-github-dispatch
          role-session-name: modelhub-exhibition-${{ github.run_id }}
          aws-region: us-east-2
          retry-max-attempts: 3
      - name: Deploy and verify managed AWS pipeline
        run: python3 scripts/ci/aws_exhibition_deploy.py
      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aws-exhibition-deployment-${{ github.sha }}
          path: artifacts/aws-exhibition-deployment.json
          if-no-files-found: ignore

apiVersion: v1
kind: ConfigMap
metadata:
  name: wg-model-hub-bootstrap
  namespace: default
data:
  bootstrap.json: |
    {
      "server_address": "mse-8d3f2a16-nacos-ans.mse.aliyuncs.com:8848",
      "namespace_id": ""
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wg-model-hub
  namespace: default
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: wg-model-hub
  template:
    metadata:
      labels:
        app: wg-model-hub
    spec:
      # LTX 调用在服务端同步等待，滚动发布要给正在下载的视频留下完成窗口。
      terminationGracePeriodSeconds: 180
      containers:
        - name: wg-model-hub
          # workspace 发布前替换为 ACR 返回的不可变 digest。
          image: wgdl-registry-vpc.cn-shenzhen.cr.aliyuncs.com/wg/wg-model-hub@sha256:REPLACE_ME
          env:
            - name: WG_SERVER_GRPC_PORT
              value: "50053"
            # 公网鉴权 listener；未设置则不启动 50054。现网 Caddy 只应反代本端口，不得暴露 50053。
            - name: WG_SERVER_PUBLIC_GRPC_PORT
              value: "50054"
          ports:
            - name: grpc
              containerPort: 50053
            - name: public-grpc
              containerPort: 50054
          startupProbe:
            grpc:
              port: 50053
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            grpc:
              port: 50053
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            grpc:
              port: 50053
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: "1"
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
          volumeMounts:
            - name: bootstrap
              mountPath: /etc/wg-model-hub/bootstrap.json
              subPath: bootstrap.json
              readOnly: true
      volumes:
        - name: bootstrap
          configMap:
            name: wg-model-hub-bootstrap
---
apiVersion: v1
kind: Service
metadata:
  name: wg-model-hub
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: wg-model-hub
  ports:
    - name: grpc
      port: 50053
      targetPort: grpc
---
apiVersion: v1
kind: Service
metadata:
  name: wg-model-hub-external
  namespace: default
  annotations:
    # 仅供同 VPC 访问：50053 为内网未鉴权 gRPC；50054 为公网鉴权 gRPC（供 8.129.236.215 TLS 反代）。
    # 保持 intranet，不得改为公网 LoadBalancer；TLS 终止与公网 DNS 由外部前置完成。
    service.beta.kubernetes.io/alibaba-cloud-loadbalancer-address-type: intranet
spec:
  type: LoadBalancer
  selector:
    app: wg-model-hub
  ports:
    - name: grpc
      port: 50053
      targetPort: grpc
    - name: public-grpc
      port: 50054
      targetPort: public-grpc
